name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**"]
  pull_request:
    paths-ignore: ["**.md", "assets/**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CONDA_OVERRIDE_CUDA: "12"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - run: pixi run pytest -q
