[project]
authors = [{name = "Danilo Biella", email = "d.biella@gmail.com"}]
dependencies = []
name = "galaxy_generation"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
galaxy_generation = { path = ".", editable = true }

[tool.pixi.dependencies]
jaxlib = { version = ">=0.6.0,<0.7.0", build = "*cuda12*" }
cuda-nvcc = ">=12.0,<13"
jax = ">=0.6.0,<0.7"
numpy = ">=2.4.3,<3"
optax = ">=0.2.8,<0.3"
dm-haiku = ">=0.0.16,<0.0.17"
grain = ">=0.2.16,<0.3"
pynvim = ">=0.6.0,<0.7"
mypy = ">=1.20.0,<2"
ruff = ">=0.15.9,<0.16"
python-lsp-server = ">=1.14.0,<2"
matplotlib = ">=3.10.8,<4"
ipython = ">=9.12.0,<10"
kaggle = ">=1.8.4,<2"
h5py = ">=3.16.0,<4"
tqdm = ">=4.67.3,<5"
lmdb = ">=0.9.35,<0.10"
python-lmdb = ">=2.1.1,<3"
pandas = ">=3.0.2,<4"

[tool.pixi.tasks]

[tool.pixi.system-requirements]
cuda = "12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]
exclude = []
namespaces = false
