<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind study - fidelity</title>
<style>
  :root {
    --bg: #07080d;
    --panel: #0e1017;
    --text: #e8eaf0;
    --muted: #868c9d;
    --line: #1c1f2b;
    --accent: #6ea8ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1.5rem 3rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .wrap { width: 100%; max-width: 820px; }

  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .35rem; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  header .count { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 1.5rem; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

  .prompt { text-align: center; color: var(--muted); font-size: 13.5px; margin-bottom: 1rem; }
  .prompt b { color: var(--text); font-weight: 600; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: .75rem;
    cursor: pointer;
    transition: border-color .12s ease, transform .12s ease;
  }

  .card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .card img {
    width: 100%;
    display: block;
    border-radius: 6px;
    background: #000;
    aspect-ratio: 1;
  }

  .card .key {
    display: block;
    margin-top: .6rem;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  .actions { display: flex; gap: .75rem; justify-content: center; margin-top: 1.5rem; color: var(--muted); font-size: 12.5px; }
  .actions button {
    padding: .35rem .8rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  .actions button:hover { color: var(--text); border-color: #2c3142; }
  .actions button[disabled] { opacity: .35; cursor: default; }

  .done { text-align: center; padding: 3rem 0; }
  .done h2 { margin: 0 0 .5rem; font-size: 1.3rem; }
  .done p { color: var(--muted); margin: 0 0 1.5rem; }
  .done button {
    padding: .6rem 1.4rem;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #06070c;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Blind study</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><div id="progress"></div></div>

  <div id="trial">
    <p class="prompt">Which is the better <b id="className"></b>?</p>
    <div class="pair">
      <div class="card" id="cardLeft"><img id="imgLeft" alt="left option"><span class="key">&larr; left</span></div>
      <div class="card" id="cardRight"><img id="imgRight" alt="right option"><span class="key">right &rarr;</span></div>
    </div>
    <div class="actions">
      <button id="undo">undo (u)</button>
      <button id="skip">skip (s)</button>
    </div>
  </div>

  <div class="done" id="done" hidden>
    <h2>Done</h2>
    <p id="doneSummary"></p>
    <button id="export">Download results</button>
  </div>

</div>

<script>
const countEl = document.getElementById("count");
const progressEl = document.getElementById("progress");
const trialEl = document.getElementById("trial");
const doneEl = document.getElementById("done");
const classNameEl = document.getElementById("className");
const imgLeft = document.getElementById("imgLeft");
const imgRight = document.getElementById("imgRight");
const undoButton = document.getElementById("undo");
const skipButton = document.getElementById("skip");

let manifest = null;
let ratings = {};
let index = 0;
let storageKey = "galaxy-study";

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({ index, ratings }));
  } catch (err) {
    console.error("could not save progress:", err);
  }
}

function restore() {
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return;
    const saved = JSON.parse(raw);
    ratings = saved.ratings ?? {};
    index = saved.index ?? 0;
  } catch (err) {
    console.error("could not restore progress:", err);
  }
}

function preload(offset) {
  const trial = manifest.trials[index + offset];
  if (!trial) return;
  for (const path of [trial.left, trial.right]) new Image().src = path;
}

function render() {
  const total = manifest.trials.length;

  if (index >= total) {
    trialEl.hidden = true;
    doneEl.hidden = false;
    countEl.textContent = `${total} / ${total}`;
    progressEl.style.width = "100%";
    const skipped = Object.values(ratings).filter((r) => r === "skip").length;
    document.getElementById("doneSummary").textContent =
      `${total - skipped} of ${total} trials rated` + (skipped ? `, ${skipped} skipped.` : ".");
    return;
  }

  const trial = manifest.trials[index];
  classNameEl.textContent = trial.class_name;
  imgLeft.src = trial.left;
  imgRight.src = trial.right;
  countEl.textContent = `${index + 1} / ${total}`;
  progressEl.style.width = `${(index / total) * 100}%`;
  undoButton.disabled = index === 0;

  preload(1);
  preload(2);
}

function answer(choice) {
  if (index >= manifest.trials.length) return;
  ratings[manifest.trials[index].id] = choice;
  index += 1;
  save();
  render();
}

function undo() {
  if (index === 0) return;
  index -= 1;
  delete ratings[manifest.trials[index].id];
  save();
  render();
}

document.getElementById("cardLeft").addEventListener("click", () => answer("left"));
document.getElementById("cardRight").addEventListener("click", () => answer("right"));
undoButton.addEventListener("click", undo);
skipButton.addEventListener("click", () => answer("skip"));

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") answer("left");
  else if (event.key === "ArrowRight") answer("right");
  else if (event.key === "u") undo();
  else if (event.key === "s") answer("skip");
});

document.getElementById("export").addEventListener("click", () => {
  const payload = {
    created: manifest.created,
    task: manifest.task,
    completed: new Date().toISOString(),
    ratings,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "results.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

async function start() {
  manifest = await (await fetch("manifest.json")).json();
  storageKey = "galaxy-study-" + manifest.created;
  restore();
  render();
}

start();
</script>
</body>
</html>
